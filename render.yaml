services:
  - type: web
    name: proovo-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      # DB_URL deve ser o JDBC completo, ex:
      #   jdbc:postgresql://<host-do-neon>/<database>?sslmode=require
      # (usuário e senha vão nas duas variáveis abaixo, não dentro da URL)
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "60"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://SEU-PROJETO.vercel.app,https://*.vercel.app"
