spring:
  application:
    name: avicola-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/avicola}
    username: ${DB_USER:avicola}
    password: ${DB_PASSWORD:avicola}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${SMTP_HOST:sandbox.smtp.mailtrap.io}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-super-secret-key-troque-em-producao-32chars+}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  mail:
    from: ${MAIL_FROM:no-reply@avicola.local}
    destinatario-equipe: ${MAIL_DESTINATARIO:equipe@avicola.local}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
