spring:
  application:
    name: avicola-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/avicola}
    username: ${DB_USER:avicola}
    password: ${DB_PASSWORD:avicola}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-super-secret-key-troque-em-producao-32chars+}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
