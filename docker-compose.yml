services:
  postgres:
    image: postgres:16-alpine
    container_name: avicola-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: avicola
      POSTGRES_PASSWORD: avicola
      POSTGRES_DB: avicola
    ports:
      - "5432:5432"
    volumes:
      - avicola_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avicola"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: avicola-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/avicola
      DB_USER: avicola
      DB_PASSWORD: avicola
      JWT_SECRET: ${JWT_SECRET:-dev-only-super-secret-key-troque-em-producao-32chars+}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: avicola-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  avicola_postgres_data:
